<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Odyssey: a heraldic shield in the register of Indian defence insignia. The field is black, the bordure and the
       chevron are white, the Ashoka chakra (24 spokes) sits at the heart in white with a red hub, and a radar sweep
       runs round the chief. Drawn with pure geometry so it reads at 28px and prints clean. -->
  <defs>
    <clipPath id="shield"><path d="M32 3 L57 11 V30 C57 45 46 56 32 61 C18 56 7 45 7 30 V11 Z"/></clipPath>
  </defs>
  <!-- field -->
  <path d="M32 3 L57 11 V30 C57 45 46 56 32 61 C18 56 7 45 7 30 V11 Z" fill="#0b0b0d"/>
  <!-- radar sweep across the chief, inside the field -->
  <g clip-path="url(#shield)" opacity="0.55">
    <path d="M32 32 L32 2 A30 30 0 0 1 58 18 Z" fill="url(#sweep)"/>
    <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
    <circle cx="32" cy="32" r="14" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
  </g>
  <defs>
    <linearGradient id="sweep" x1="32" y1="32" x2="58" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- chevron: the early-warning line across the shield -->
  <path d="M10 36 L32 24 L54 36" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- chakra: 24 spokes, rim, red hub -->
  <g transform="translate(32 40)">
    <circle r="11" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <g stroke="#ffffff" stroke-width="1" stroke-linecap="round">
      <line y1="-10" y2="-3.2"/>
      <line y1="-10" y2="-3.2" transform="rotate(15)"/>
      <line y1="-10" y2="-3.2" transform="rotate(30)"/>
      <line y1="-10" y2="-3.2" transform="rotate(45)"/>
      <line y1="-10" y2="-3.2" transform="rotate(60)"/>
      <line y1="-10" y2="-3.2" transform="rotate(75)"/>
      <line y1="-10" y2="-3.2" transform="rotate(90)"/>
      <line y1="-10" y2="-3.2" transform="rotate(105)"/>
      <line y1="-10" y2="-3.2" transform="rotate(120)"/>
      <line y1="-10" y2="-3.2" transform="rotate(135)"/>
      <line y1="-10" y2="-3.2" transform="rotate(150)"/>
      <line y1="-10" y2="-3.2" transform="rotate(165)"/>
      <line y1="-10" y2="-3.2" transform="rotate(180)"/>
      <line y1="-10" y2="-3.2" transform="rotate(195)"/>
      <line y1="-10" y2="-3.2" transform="rotate(210)"/>
      <line y1="-10" y2="-3.2" transform="rotate(225)"/>
      <line y1="-10" y2="-3.2" transform="rotate(240)"/>
      <line y1="-10" y2="-3.2" transform="rotate(255)"/>
      <line y1="-10" y2="-3.2" transform="rotate(270)"/>
      <line y1="-10" y2="-3.2" transform="rotate(285)"/>
      <line y1="-10" y2="-3.2" transform="rotate(300)"/>
      <line y1="-10" y2="-3.2" transform="rotate(315)"/>
      <line y1="-10" y2="-3.2" transform="rotate(330)"/>
      <line y1="-10" y2="-3.2" transform="rotate(345)"/>
    </g>
    <circle r="3" fill="#e5383b"/>
  </g>
  <!-- bordure -->
  <path d="M32 3 L57 11 V30 C57 45 46 56 32 61 C18 56 7 45 7 30 V11 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
